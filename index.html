<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meadi Aqua Tech - Admin Portal</title>
  
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Meta tags for PWA Mobile view -->
  <meta name="theme-color" content="#00a2ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Apple Touch Icon with correct naming -->
  <link rel="apple-touch-icon" href="icon-192x192.png">
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .portal-container {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
    }
    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      margin-bottom: 25px;
    }
    .btn {
      display: inline-block;
      background-color: #00a2ff;
      color: white;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #0081cc;
    }
  </style>
</head>
<body>

  <div class="portal-container">
    <!-- உங்கள் 512x512 லோகோ இமேஜ் -->
    <img src="icon-512x512.png" alt="Meadi Aqua Tech Logo" class="logo">
    <h1>Meadi Aqua Tech</h1>
    <p>Admin Control & Service Portal</p>
    <a href="admin.html" class="btn">Login to Dashboard</a>
  </div>

  <!-- Service Worker Registration Script -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('Service Worker registered successfully!', reg.scope);
          })
          .catch((err) => {
            console.error('Service Worker registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>
